<text x="1176" y="801" font-size="20" fill="#16202b">Accept or reject incoming orders</text>
<rect x="1080" y="846" width="660" height="66" rx="10" fill="#ffffff" stroke="#c9d3db" stroke-width="2"/>
<path d="M1082,856 a8,8 0 0 1 8,-8 l6,0 l0,62 l-6,0 a8,8 0 0 1 -8,-8 Z" fill="#e4502a"/>
<circle cx="1138" cy="879" r="21" fill="#fdeee9"/>
<text x="1138" y="887" text-anchor="middle" font-size="21" font-weight="700" fill="#b83c1c">7</text>
<text x="1176" y="887" font-size="20" fill="#16202b">Preparing  →  Ready  →  Handed over</text>
<rect x="1080" y="932" width="660" height="66" rx="10" fill="#ffffff" stroke="#c9d3db" stroke-width="2"/>
<path d="M1082,942 a8,8 0 0 1 8,-8 l6,0 l0,62 l-6,0 a8,8 0 0 1 -8,-8 Z" fill="#e4502a"/>
