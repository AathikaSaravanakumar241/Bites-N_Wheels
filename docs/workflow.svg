<text x="70" y="66" font-size="36" font-weight="700" fill="#12303f">Bites-N-Wheels — User Workflow</text>
<text x="70" y="102" font-size="19" fill="#5c6b7a">One login, two roles. The truck owner publishes a journey; the customer picks an area and sees only what is coming to it.</text>
