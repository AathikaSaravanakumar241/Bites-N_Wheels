<text x="1138" y="973" text-anchor="middle" font-size="21" font-weight="700" fill="#b83c1c">8</text>
<text x="1176" y="973" font-size="20" fill="#16202b">Walk-in billing and demand insights</text>
<rect x="70" y="1018" width="1710" height="2" fill="#c9d3db"/>
<text x="925" y="1052" text-anchor="middle" font-size="18" fill="#0b6b78" font-weight="600">A truck appears to a customer only if today’s journey includes that customer’s area  ·  one order always comes from one truck</text>
