<text x="1176" y="371" font-size="20" fill="#16202b">Set up truck profile, tagline, cuisine</text>
<rect x="1080" y="416" width="660" height="66" rx="10" fill="#ffffff" stroke="#c9d3db" stroke-width="2"/>
<path d="M1082,426 a8,8 0 0 1 8,-8 l6,0 l0,62 l-6,0 a8,8 0 0 1 -8,-8 Z" fill="#e4502a"/>
<circle cx="1138" cy="449" r="21" fill="#fdeee9"/>
