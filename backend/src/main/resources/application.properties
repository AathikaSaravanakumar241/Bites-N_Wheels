spring.application.name=bitesonwheels

# ---------------------------------------------------------------------
# NO CREDENTIALS IN THIS FILE - it is committed to a public repo.
#
# Database URL / username / password and jwt.secret all live in
#   src/main/resources/application-local.properties
# which is gitignored. Copy application-local.properties.example to
# create it. The "local" profile below loads it automatically, so a
# plain `mvnw spring-boot:run` is all you need.
#
# Deployment overrides the profile with the SPRING_PROFILES_ACTIVE env var.
# ---------------------------------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# The schema is owned by docs/schema.sql, applied manually in Supabase.
# validate = fail fast at startup if an entity and a table disagree.
# Never switch this to update/create - it will silently drift from the SQL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Be explicit about the schema so a stray search_path cannot send
# Hibernate looking in the wrong place.
spring.jpa.properties.hibernate.default_schema=public

jwt.expiration-ms=86400000
